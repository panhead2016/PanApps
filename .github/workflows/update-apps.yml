name: Update apps

# Checks the projects listed in sync.json for new GitHub releases
# (once a day, and whenever you press "Run workflow" on the Actions tab)
# and updates apps.json so FlareStore sees the new version.

on:
  schedule:
    - cron: "23 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Sync watched GitHub projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 Scripts/sync_apps.py

      - name: Commit any changes
        run: |
          if git diff --quiet; then
            echo "No updates today."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps.json
            git commit -m "Sync app versions from upstream releases"
            git push
          fi

      - name: Open a notification issue
        if: hashFiles('update-report.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "App update ready in your repo" \
            --body-file update-report.md
